[project]
name = "ev-charging-siting"
version = "0.1.0"
description = "EV charging station siting optimization and analytics"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
requires-python = ">=3.10"

[project.dependencies]
python = "^3.10"
pandas = "^2.0"
geopandas = "^0.14"
