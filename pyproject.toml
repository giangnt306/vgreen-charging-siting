[project]
name = "ev-charging-siting"
version = "0.1.0"
description = "EV charging station siting optimization and analytics"
authors = [{ name = "Giang (wanderer210)" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h3>=4.0",
    "numpy>=1.26",
    "osmium>=3.7",
    "pandas>=2.0",
    "playwright>=1.44",
    "pyarrow>=16.0",
    "rapidfuzz>=3.0",
    "rasterio>=1.3",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "shapely>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Baseline thực dụng (28/07): lỗi thật + import hygiene. Siết thêm trong vòng fix (F-register).
select = ["E4", "E7", "E9", "F", "I"]
# Style nén dòng hiện hữu của codebase — chấp nhận ở baseline, không chặn CI.
ignore = ["E701", "E702", "E731", "E741"]
